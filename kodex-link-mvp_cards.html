  ['Adobe','A','#ef4444','kodex','Technology & Platforms'],['OpenAI','◎','#111827','kodex','Technology & Platforms'],['Airbnb','A','#ff5a5f','kodex','Technology & Platforms'],['Slack','#','#36c5f0','link','Technology & Platforms'],['Cloudflare','C','#f48120','link','Technology & Platforms'],['Toast','T','#ff4f00','link','Technology & Platforms'],['Poshmark','P','#7b2b42','link','Technology & Platforms'],['Apple','●','#111827','directory','Technology & Platforms'],['Microsoft','M','#4e90d7','directory','Technology & Platforms'],['Meta','∞','#1877f2','directory','Technology & Platforms']
];
function icon(type){return `<span class="route-icon ${type==='kodex'?'purple':type==='link'?'teal':'gray'}">${type==='kodex'?'✓':type==='link'?'↗':'i'}</span>`}
function demoToggle(){return `<div class="top-actions"><div class="demo-toggle"><button class="${state.mode==='agent'?'on':''}" onclick="switchMode('agent')">Agent experience</button><button class="${state.mode==='provider'?'on':''}" onclick="switchMode('provider')">Provider experience</button></div><button class="reset" onclick="resetDemo()">↻ Reset</button></div>`}
function sidebar(){return `<aside class="sidebar"><div class="nav-brand"><span class="logo">K</span>Kodex</div><a><span class="nav-icon">⚙</span>Settings</a><a><span class="nav-icon">●</span>Notifications</a><div class="nav-section">Requests</div><a><span class="nav-icon">⌂</span>Home</a><a><span class="nav-icon">☷</span>Triage Queue<span class="nav-badge">12</span></a><a><span class="nav-icon">≡</span>All Requests</a><a class="active"><span class="nav-icon">＋</span>New Request</a><div class="nav-section">Reporting</div><a><span class="nav-icon">▥</span>Transparency Report</a><a><span class="nav-icon">↗</span>Insights</a><a><span class="nav-icon">⇩</span>Export Results</a><div class="nav-section">Contacts</div><a><span class="nav-icon">◉</span>Agents</a><div class="sidebar-spacer"></div><a><span class="nav-icon">?</span>Help / Info</a><a><span class="nav-icon">↪</span>Sign Out</a><span class="collapse-btn">≪</span></aside>`}
function agentShell(content,panel=''){return `<div class="app">${sidebar()}<main class="main ${panel?'with-panel':''}">${content}</main>${panel}</div>`}
function pageTop(title,sub){return `<div class="topbar"><div><h1 class="page-title">${title}</h1><div class="sub">${sub}</div></div>${demoToggle()}</div>`}
function mark(c){return `<span class="company-mark" style="color:${c[2]};background:${c[2]}0d;border-color:${c[2]}33">${c[1]}</span>`}
function directory(){
  const cats=['Social, Dating & Gaming','Finance & Crypto','Technology & Platforms'];
  const groups=cats.map(cat=>{const rows=companies.filter(c=>c[4]===cat).map(c=>`<button class="provider-card" onclick="selectProvider('${c[0]}')">${mark(c)}<strong>${c[0]}</strong>${icon(c[3])}</button>`).join('');return `<section class="section"><div class="section-head"><span>⌄</span><h2>${cat}</h2><span class="count">${companies.filter(c=>c[4]===cat).length}</span></div><div class="provider-grid">${rows}</div></section>`}).join('');
  const panel=state.selected?providerPanel(companies.find(c=>c[0]===state.selected)):'';
  return agentShell(`${pageTop('Create a New Request','Start by choosing a company. Kodex automatically routes the request to the right submission experience.')}<div class="directory-tools"><div class="filters"><button class="chip on">All companies</button><button class="chip">Our providers</button><button class="chip">Secure Link</button><button class="chip">External portals</button></div><label class="search">⌕ <input placeholder="Search companies..."></label></div><div class="routing-card"><div class="route-item">${icon('kodex')}<div><strong>Our providers</strong><small>Submit and track requests in Kodex</small></div></div><div class="route-item">${icon('link')}<div><strong>Secure Link</strong><small>You send a secure invitation</small></div></div><div class="route-item">${icon('directory')}<div><strong>Directory</strong><small>Guidance for submitting outside Kodex</small></div></div></div>${groups}<button class="add-provider">＋ Can’t find the company? <b>Add a new provider</b></button>`,panel)
}
function providerPanel(c){const copy=c[3]==='link'?['Secure Link','Out-of-network provider','Kodex prepares a secure request. You will send the invitation from your verified agency inbox.','Create secure request']:c[3]==='kodex'?['Our provider','Managed in Kodex','Submit and track this request entirely in Kodex.','Create request']:['Directory only','External submission','This company uses its own legal request process.','View instructions'];return `<aside class="side-panel"><div class="panel-tabs"><span class="panel-tab">Company details</span><button class="panel-close" onclick="closePanel()">×</button></div><div class="provider-head">${mark(c)}<div><h2>${c[0]}</h2><span class="tag link">${copy[0]}</span></div></div><section class="panel-section"><span class="eyebrow">How this request works</span><h3>${copy[1]}</h3><p>${copy[2]}</p>${c[3]==='link'?`<div class="callout"><span>!</span><div><b>Best-effort delivery</b>Kodex cannot confirm the message was sent until the provider authenticates.</div></div>`:''}<button class="btn ${c[3]==='link'?'primary':''} full" onclick="${c[3]==='link'?"go('details')":''}">${copy[3]} →</button></section><section class="panel-section"><span class="label">BEFORE YOU BEGIN</span><ul class="requirements"><li>Original legal process</li><li>${c[3]==='link'?'Provider recipient email':'Request reference and deadline'}</li><li>Requested records and date range</li></ul></section><button class="btn full">View law enforcement guidelines ↗</button></aside>`}
function steps(active){const labels=['Company','Request details','Review','Send','Activity'];return `<div class="stepper">${labels.map((l,i)=>`<div class="step ${i<active?'done':i===active?'on':''}"><span>${i<active?'✓':i+1}</span>${l}</div>`).join('')}</div>`}
function workflowHead(eyebrow,title,sub,badge=''){return `<div class="workflow-head"><div><button class="back" onclick="go('${state.screen==='details'?'directory':state.screen==='review'?'details':state.screen==='send'?'review':'directory'}')">← Back</button><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div>${badge}</div>`}
function details(){return agentShell(`${pageTop('New Request','Secure Link · Toast')}${steps(1)}${workflowHead('Secure Link · Toast','Request details','Add the provider recipient and legal process. The secure invitation will be tied to this exact inbox.','<span class="status-badge amber">Best-effort delivery</span>')}<div class="form-grid"><section class="card form-card"><div class="card-title"><span class="num">1</span><div><h2>Provider and recipient</h2><p>Only this inbox can access the secure request.</p></div></div><label class="field">Company<div class="selected-company"><span class="company-mark" style="color:#ff4f00;background:#ff4f000d">T</span><div><b>Toast</b><small>Out-of-network provider</small></div>${icon('link')}</div></label><label class="field">Recipient email<input value="legal@toasttab.com"></label><div class="field-note">⌾ Access will be verified through legal@toasttab.com</div></section><section class="card form-card"><div class="card-title"><span class="num">2</span><div><h2>Legal process</h2><p>Kodex retains the original file without modification.</p></div></div><div class="file-row"><span class="file-type">PDF</span><div><b>ORDER_2026_0814.pdf</b><small>2.4 MB · Ready for processing</small></div><span class="check">✓</span></div><div class="form-row"><label class="field">Legal process type<select><option>Search warrant</option><option>Subpoena</option></select></label><label class="field">Deadline<input type="date" value="2026-08-21"></label></div><label class="field">Jurisdiction<input value="Superior Court of California, San Francisco"></label><label class="field">Agency reference<input value="SFPD-2026-0814"></label></section></div><div class="footer-actions"><span>AI will extract targets after you continue.</span><button class="btn primary" onclick="go('review')">Process and review request →</button></div>`)}
function documentView(){return `<div class="document"><div class="docbar"><span>ORDER_2026_0814.pdf</span><span>− &nbsp; 100% &nbsp; ＋</span></div><div class="paper"><div class="seal">SC</div><div class="center">SUPERIOR COURT OF CALIFORNIA</div><h3>SEARCH WARRANT</h3><div class="center">Case No. SFPD-2026-0814</div><div class="rule"></div><p>TO: Toast, Inc.</p><p>You are ordered to disclose records associated with the identifiers below for the period specified.</p><div class="highlight"><b>Merchant ID</b><br>TOAST-MERCHANT-88412</div><div class="highlight"><b>Account email</b><br>m.chen@example.com</div><p>Records requested: account registration, access history, and transaction records from June 1–30, 2026.</p><div class="rule" style="width:60%;margin-top:30px"></div><small>Judge of the Superior Court · August 4, 2026</small></div></div>`}
function extraction(){return `<div class="extraction"><div class="warning"><b>!</b><div><b>Confirm against the source</b><br>Unconfirmed information will not be shared with the provider.</div></div><div class="data-section"><span class="label">REQUEST INFORMATION</span><div class="data-list"><div><span>Process type</span><b>Search warrant</b></div><div><span>Deadline</span><b>Aug 21, 2026</b></div><div><span>Records requested</span><b>Registration, access history, transactions</b></div><div><span>Date range</span><b>Jun 1–30, 2026</b></div></div></div><div class="data-section"><span class="label">EXTRACTED TARGETS</span><div class="target"><div><small>Merchant ID</small><b>TOAST-MERCHANT-88412</b></div><span class="origin">Extracted</span></div><div class="target"><div><small>Account email</small><b>m.chen@example.com</b></div><span class="origin">Extracted</span></div></div><label class="confirm"><input type="checkbox" ${state.confirmed?'checked':''} onchange="setConfirmed(this.checked)"><div><b>I reviewed and confirm this request</b><small>The targets, scope, deadline, provider, and recipient match the original legal process.</small></div></label></div>`}
function review(){return agentShell(`${pageTop('New Request','Secure Link · Toast')}${steps(2)}${workflowHead('Human confirmation required','Review extracted request','Compare Kodex’s extraction with the original legal process. The source document remains authoritative.','<span class="status-badge teal">✦ AI-assisted extraction</span>')}<div class="review-grid">${documentView()}${extraction()}</div><div class="footer-actions"><span>Original file integrity hash: <b>2F4A…91CE</b></span><button class="btn primary" ${state.confirmed?'':'disabled'} onclick="go('send')">Confirm and generate email →</button></div>`)}
function send(){return agentShell(`${pageTop('New Request','Secure Link · Toast')}${steps(3)}${workflowHead('Request ready for distribution','Send the secure invitation','Kodex prepared the email. You still need to send it from your verified agency inbox.','<span class="status-badge amber">● Email generated — not yet sent</span>')}<div class="send-grid"><section class="card instructions"><span class="num">1</span><h2>Download the prepared email</h2><p>The standardized email includes one secure request-specific link and no sensitive attachments.</p><button class="btn" onclick="downloadEmail(this)">${state.downloaded?'✓ Email ready in Downloads':'↓ Download email (.eml)'}</button><div class="divider"></div><span class="num">2</span><h2>Send from your agency inbox</h2><p>Open and send the email from <b>jason.wu@sfgov.org</b>. Kodex updates the request after the provider authenticates.</p><div class="callout"><span>!</span><div><b>Kodex cannot confirm delivery yet</b>This status remains “not yet sent” until provider access.</div></div></section><section class="card email"><div class="email-head"><b>Prepared email</b><span>STANDARDIZED TEMPLATE</span></div><div class="email-meta"><div><span>To</span>legal@toasttab.com</div><div><span>Subject</span>Secure legal request from San Francisco Police Department</div></div><div class="email-body"><p>Hello,</p><p>Jason Wu, a verified agent with the San Francisco Police Department, prepared a legal request for Toast.</p><div class="email-box"><div><small>Request reference</small><b>SFPD-2026-0814</b></div><div><small>Response requested by</small><b>August 21, 2026</b></div></div><button class="btn teal full">Review and respond securely</button><p><small>Kodex facilitates this secure exchange. No account or software installation is required.</small></p></div></section></div><div class="footer-actions"><span>The prepared email remains attached to this request.</span><button class="btn primary" onclick="go('activity')">View request activity →</button></div>`)}
function activity(){const l=state.lifecycle;return agentShell(`${pageTop('Toast legal request','SFPD-2026-0814 · Created August 10, 2026')}<div class="tabs"><span class="status-badge ${l==='generated'?'amber':l==='accessed'?'teal':'green'}">${l==='generated'?'Email generated — not yet sent':l==='accessed'?'Provider accessed request':'Response submitted'}</span></div><div class="activity-grid" style="margin-top:20px"><section class="card summary-card"><div class="summary-provider"><span class="company-mark" style="color:#ff4f00">T</span><div><b>Toast</b><small>legal@toasttab.com</small></div></div><div class="summary-stats"><div><span>Request type</span><b>Search warrant</b></div><div><span>Deadline</span><b>Aug 21, 2026</b></div><div><span>Targets</span><b>2 confirmed</b></div><div><span>Delivery</span><b>Secure Link</b></div></div><button class="btn full">${l==='submitted'?'↓ Download provider response':'↓ Download prepared email'}</button></section><section class="card timeline"><h2>Activity</h2><div class="event"><span class="event-dot">✓</span><div><b>Request package created</b><p>Original document and 2 confirmed targets</p><small>Aug 10 · 9:42 AM</small></div></div><div class="event"><span class="event-dot">✉</span><div><b>Email generated</b><p>Waiting for provider authentication</p><small>Aug 10 · 9:44 AM</small></div></div>${l!=='generated'?`<div class="event teal"><span class="event-dot">⌾</span><div><b>Provider authenticated</b><p>Verified through legal@toasttab.com</p><small>Aug 10 · 10:18 AM</small></div></div>`:''}${l==='submitted'?`<div class="event teal"><span class="event-dot">↑</span><div><b>Response submitted</b><p>Production letter and responsive data received</p><small>Aug 10 · 10:31 AM</small></div></div>`:''}<div class="event pending"><span class="event-dot"></span><div><b>${l==='submitted'?'Request complete':'Awaiting provider response'}</b></div></div></section></div><div class="demo-control"><span><b>Demo controls</b> · Preview agent-side lifecycle states</span><button onclick="advanceLifecycle()">${l==='generated'?'Simulate provider access':l==='accessed'?'Simulate response submission':'Restart lifecycle'}</button></div>`)}
function providerHeader(){return `<header class="provider-header"><div class="brand"><span class="logo" style="background:#151517;color:#fff">K</span>Kodex Secure Request</div><div class="provider-demo">${demoToggle()}</div><span class="right">Report suspicious request</span></header>`}
function auth(){return `<div class="provider-app">${providerHeader()}<div class="auth-card"><span class="lock">⌾</span><div class="eyebrow" style="color:var(--teal)">Verify your inbox</div><h1>Review a legal request for Toast</h1><p>To protect sensitive information, verify that you have access to the inbox this request was sent to.</p><div class="recipient"><span>✉</span><div><small>Request sent to</small><b>legal@toasttab.com</b></div></div><label class="field" style="text-align:left">6-digit verification code<input class="code" value="482913"></label><button class="btn teal full" onclick="providerGo('review')">Verify and review request →</button><small style="display:block;color:var(--muted);margin-top:13px">No account or password required · Code expires in 10 minutes</small></div><div class="trust-row"><span>✓ Verified requesting agency</span><span>◇ Encrypted exchange</span><span>◷ Request-specific access</span></div></div>`}
function providerReview(){return `<div class="provider-app">${providerHeader()}<main class="provider-content"><div class="agency-banner"><span class="agency-seal">SF</span><div><span class="eyebrow" style="color:var(--teal)">Verified legal request</span><h2>San Francisco Police Department</h2><p>Jason Wu · Verified law enforcement agent</p></div><button>Report suspicious request</button></div><div class="provider-review">${documentView()}<section class="request-summary"><span class="deadline">Respond by Aug 21</span><div class="eyebrow" style="color:var(--teal)">Request overview</div><h1>Search warrant for Toast</h1><p>Review the original legal process before responding.</p><div class="summary-stats"><div><span>Reference</span><b>SFPD-2026-0814</b></div><div><span>Issued</span><b>Aug 4, 2026</b></div><div><span>Recipient</span><b>legal@toasttab.com</b></div><div><span>Jurisdiction</span><b>California</b></div></div><div class="ai-box"><h3>✦ Kodex-extracted targets</h3><div class="target-row"><span>Merchant ID</span><b>TOAST-MERCHANT-88412</b></div><div class="target-row"><span>Account email</span><b>m.chen@example.com</b></div></div><div><b>What to submit</b><ul class="requirements"><li>Production or cover letter</li><li>Responsive account and transaction data</li></ul></div><div class="provider-actions"><button class="btn" onclick="providerGo('reject')">Reject request</button><button class="btn teal" onclick="providerGo('response')">Prepare response →</button></div></section></div></main></div>`}
function response(){return `<div class="provider-app">${providerHeader()}<main class="provider-content"><button class="back" onclick="providerGo('review')">← Back to request overview</button><div class="workflow-head"><div><div class="eyebrow" style="color:var(--teal)">SFPD-2026-0814</div><h1>Submit your response</h1><p>Upload the production letter and responsive data for this request.</p></div></div><div class="response-grid"><section class="card upload-card"><div class="card-title"><span class="num" style="background:var(--teal-bg);color:var(--teal)">1</span><div><h2>Response files</h2><p>PDF, ZIP, CSV, or JSON · 5 GB total · Up to 50 files</p></div></div>${state.files?`<div class="response-files"><div class="file-row"><span class="file-type">PDF</span><div><b>Production_Letter.pdf</b><small>842 KB · Upload complete</small></div><span class="check">✓</span></div><div class="file-row"><span class="file-type" style="background:#ede9fe;color:var(--purple)">ZIP</span><div><b>Responsive_Data.zip</b><small>128 MB · Upload complete</small></div><span class="check">✓</span></div><button class="btn full">＋ Add more files</button></div>`:`<button class="dropzone" onclick="addFiles()"><span style="font-size:20px;color:var(--teal)">↑</span><b>Add demo response files</b><small>or drag and drop files here</small></button>`}</section><section class="card cert-card"><div class="card-title"><span class="num" style="background:var(--teal-bg);color:var(--teal)">2</span><div><h2>Review and certify</h2><p>Confirm the files belong to this request.</p></div></div><div class="data-list"><div><span>Provider</span><b>Toast</b></div><div><span>Reference</span><b>SFPD-2026-0814</b></div><div><span>Files</span><b>${state.files?'2 files · 129 MB':'No files added'}</b></div></div><label class="confirm"><input type="checkbox" ${state.certified?'checked':''} onchange="certify(this.checked)"><div><b>I am authorized to submit this response</b><small>I confirm these materials relate to this request.</small></div></label><p style="font-size:10px;color:var(--muted)">By submitting, you acknowledge the Kodex secure submission terms.</p><button class="btn teal full" ${state.files&&state.certified?'':'disabled'} onclick="providerGo('receipt')">Submit response securely →</button></section></div></main></div>`}
function receipt(rejected=false){return `<div class="provider-app">${providerHeader()}<div class="receipt-card"><span class="${rejected?'rejected':'success'}">${rejected?'×':'✓'}</span><div class="eyebrow" style="color:${rejected?'var(--red)':'var(--teal)'}">${rejected?'Request closed':'Submission complete'}</div><h1>${rejected?'Your rejection was sent':'Your response was securely submitted'}</h1><p>${rejected?'Jason Wu was notified and received the reason you provided.':'Kodex notified Jason Wu at the San Francisco Police Department.'}</p><div class="receipt-details"><div><span>Request reference</span><b>SFPD-2026-0814</b></div>${rejected?'<div><span>Reason</span><b>Legal process invalid or incomplete</b></div>':'<div><span>Submitted</span><b>Aug 10, 2026 · 10:31 AM PDT</b></div><div><span>Files</span><b>2 files · 129 MB</b></div>'}</div>${rejected?'':'<button class="btn full">↓ Download submission receipt</button>'}<small style="display:block;color:var(--muted);margin-top:14px">${rejected?'No files were uploaded.':'No Kodex account was created.'}</small></div></div>`}
function reject(){return `<div class="provider-app">${providerHeader()}<div class="reject-card"><button class="back" onclick="providerGo('review')">← Back to request</button><div class="eyebrow" style="color:var(--red)">Alternative response</div><h1>Reject this request</h1><p>Provide a reason so the requesting agent can understand what needs to change.</p>${['Request was sent to the wrong provider','Legal process is invalid or incomplete','Requested information is not available','Other'].map((x,i)=>`<label class="option"><input name="reason" type="radio" ${i===1?'checked':''}>${x}</label>`).join('')}<label class="field">Additional details<textarea>The legal process does not include the required judicial signature.</textarea></label><div class="callout" style="background:var(--red-bg);border-color:#f3c0c0;color:var(--red)">! Rejecting closes this request and notifies the agent.</div><button class="btn danger full" onclick="providerGo('rejected')">Reject request</button></div></div>`}
function render(){let html;if(state.mode==='agent'){html=state.screen==='directory'?directory():state.screen==='details'?details():state.screen==='review'?review():state.screen==='send'?send():activity()}else{html=state.provider==='auth'?auth():state.provider==='review'?providerReview():state.provider==='response'?response():state.provider==='receipt'?receipt(false):state.provider==='reject'?reject():receipt(true)}document.getElementById('root').innerHTML=html;window.scrollTo(0,0)}
function switchMode(mode){state.mode=mode;render()}function resetDemo(){Object.assign(state,{mode:state.mode,screen:'directory',selected:null,confirmed:false,downloaded:false,lifecycle:'generated',provider:'auth',files:false,certified:false,rejected:false});render()}
function selectProvider(name){state.selected=name;render()}function closePanel(){state.selected=null;render()}function go(screen){state.screen=screen;state.selected=null;render()}function setConfirmed(v){state.confirmed=v;render()}function downloadEmail(){state.downloaded=true;render()}function advanceLifecycle(){state.lifecycle=state.lifecycle==='generated'?'accessed':state.lifecycle==='accessed'?'submitted':'generated';render()}
function providerGo(screen){state.provider=screen;render()}function addFiles(){state.files=true;render()}function certify(v){state.certified=v;render()}
render();
</script>
