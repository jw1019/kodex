/* Inline review prototype: keep reference column accessible. */
#rfLayer{position:static;z-index:auto;width:100%;min-width:0}

#rfLayer .rf-drawer{position:relative!important;inset:auto!important;width:100%!important;max-width:none!important;height:auto!important;max-height:none!important;transform:none!important;box-shadow:none!important;border:0;border-radius:0;background:#fafbfc;animation:none}
#rfLayer .rf-dr-h{padding:16px 20px;border-top:1px solid var(--line);background:#f8f9fb}
#rfLayer .rf-dr-b{height:auto;max-height:none;overflow:visible;padding:16px 20px 20px}
#rfLayer .rf-dr-f{position:static}
.rf-row.open{background:#eef2fc}.rf-row .rf-chev{transform:rotate(90deg)}.rf-row.open .rf-chev{transform:rotate(-90deg)}
.inline-info{margin:0 0 16px;border:1px solid #eadcb9;border-radius:10px;overflow:hidden;background:#fffaf0}

.inline-info-head b{display:flex;align-items:center;gap:8px;font-size:13px;color:#765923}.inline-info-head svg{width:16px;height:16px}
.inline-info-head p{font-size:12px;color:#89764f;margin:3px 0 0}

.inline-info .tc{display:inline-block;border-radius:20px;background:#fff3d6;padding:0 6px;color:#856524}
.inline-info-content{max-height:320px;overflow-y:auto;scrollbar-gutter:stable;padding:16px;background:#fff}

.rf-row.open{background:#eef2fc!important;box-shadow:inset 0 -1px 0 #d6deef}
.rf-row.open .rf-name{color:#243f8f}
.rf-row.open .rf-chev{color:#3a5fcf}

/* Continuous boundary for the expanded check, without shifting its content. */
#rfLayer .rf-drawer::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#8097df;pointer-events:none;z-index:1}

/* Compact spacing between expanded review sections. */
#rfLayer .rf-dr-b{gap:12px}
#rfLayer .rf-sec{margin-top:0}

/* White expanded row; the detail border signals its open state. */
#pane .rf-row.open{background:#fff!important}

/* Connect the white summary row to its expanded details. */
#pane .rf-row.open{background:#fff!important;box-shadow:inset 3px 0 0 #8097df,inset 0 -1px 0 #d6deef}
#rfLayer .rf-status{background:#fff}

/* Limit the blue indicator to the expanded summary row. */
#rfLayer .rf-drawer::after{display:none}

/* Visible outline for the result-status card in all review states. */
#rfLayer .rf-status{background:#fff;border:1px solid #d9dde5}

/* Remove the standalone Important information section. */
#pane .inline-info{display:none}

/* Expanded detail surface. */
#rfLayer .rf-drawer,#rfLayer .rf-dr-b{background:#F9FAFD!important}

/* ===== v12 · Table look; each item is a container that eases open ===== */
.rf-card{overflow:clip}
.rf-item{margin:0;border:1px solid transparent;border-bottom-color:#eef0f3;border-radius:0;background:#fff;overflow:clip;transition:margin .26s cubic-bezier(.2,.7,.3,1),border-color .2s ease,border-radius .26s ease}
.rf-item:last-child{border-bottom-color:transparent}
.rf-item>.rf-row{border-bottom:0}
.rf-item.st-done{background:#f6fbf7}
.rf-item.open{margin:8px 10px 10px;border-color:#c5cad1;border-radius:10px}
/* Header: the item's summary row stays pinned while you scroll its details */
#pane .rf-item>.rf-row.open{position:sticky;top:0;z-index:4;background:#fff!important;border-bottom:1px solid #e3e6ec;box-shadow:none!important}

/* Inside: flat sections instead of nested cards; "Your review" stays a card */
#rfLayer .rf-dr-b{gap:16px}
#rfLayer .rf-status{background:none;border:0;padding:0}
#rfLayer .rf-sec{background:none;border:0;border-top:1px solid #e3e6ec;border-radius:0;padding:16px 0 0;margin:0}
#rfLayer .rf-rv+.rf-sec{border-top:0;padding-top:0}
/* Fixes: drawer's old z-index:71 hid the page footer and sticky header;

#rfLayer .rf-drawer{z-index:auto!important}
.rf-row.v53.open:hover .rf-chev,.rf-row.v53.open .rf-chev{transform:rotate(-90deg)}
.rf-row.v53:not(.open):hover .rf-chev{transform:rotate(90deg) translateX(2px)}
.rf-status-top{flex-wrap:wrap}

/* ===== v8 · Done vs. pending, told by the action column ===== */
/* Pending: a real button */
.rf-row.v53 .rf-do:not(.miss):not(.rf-collapse){display:inline-flex;align-items:center;height:28px;padding:0 12px;border:1px solid #dfe2e7;border-radius:8px;background:#fff;color:var(--text);font-size:12.5px;font-weight:500}
.rf-row.v53:hover .rf-do:not(.miss):not(.rf-collapse){background:#f6f7f9;border-color:#cdd2d9;color:var(--text)}

.rf-row.v53.st-done .rf-step .rf-pill.you>svg{width:14px;height:14px;padding:0;background:none;color:var(--green);stroke-width:2.6}

.rf-row.v53.st-done{background:#f6fbf7}

// Derive pinned state from the stable item boundary, not the changing header height.
(()=>{
 let queued=false;
 function update(){
  queued=false;
  document.querySelectorAll('#pane .rf-item>.rf-row').forEach(row=>{
   const item=row.parentElement;
   const pinned=row.classList.contains('open')&&item.classList.contains('open')&&item.getBoundingClientRect().top<0;
   row.classList.toggle('is-pinned',pinned);
  });
 }
 function schedule(){if(!queued){queued=true;requestAnimationFrame(update);}}
 window.addEventListener('scroll',schedule,{passive:true});
 window.addEventListener('resize',schedule,{passive:true});
 const pane=document.getElementById('pane');
 if(pane)new MutationObserver(schedule).observe(pane,{childList:true,subtree:true});
 schedule();
})();
