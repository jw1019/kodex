<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kodex · Create New Request</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --canvas:#f6f6f4;--surface:#fff;--surface-2:#f3f4f6;--ink:#181817;--muted:#6b6d73;
    --line:#e3e5e8;--line-strong:#d4d7dc;--violet:#6842d8;--violet-dark:#5130b7;
    --violet-soft:#eee9ff;--teal:#147d76;--teal-soft:#e3f4f0;--slate:#667078;
    --slate-soft:#edf0f1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink)}
  body.drawer-open{overflow:hidden}
  body,button,input,select{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit}
  button{cursor:pointer}
  svg{display:block}

  .shell{min-height:100vh}
  .sidebar{width:216px;background:#202022;color:#f0f0f1;position:fixed;inset:0 auto 0 0;z-index:30;padding:30px 0 18px;display:flex;flex-direction:column}
  .sidebar a{display:flex;align-items:center;gap:12px;padding:11px 16px;color:#f0f0f1;text-decoration:none;font-size:13px;font-weight:650;border-left:3px solid transparent}
  .sidebar a:hover{background:#2a2a2c}
  .sidebar a.active{background:#3a3a3c;color:#fff;font-weight:750}
  .sidebar a.active .nav-icon{color:#1dd4c7}
  .nav-icon{width:17px;height:17px;display:grid;place-items:center;color:#c4c4c8}
  .sidebar-break{height:32px}
  .sidebar-spacer{flex:1}
  .collapse{position:absolute;top:52px;left:198px;width:34px;height:34px;border-radius:50%;background:#17cbbb;color:#063d38;display:grid;place-items:center;border:3px solid var(--canvas);box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:14px}

  .shell-main{margin-left:216px;min-height:100vh}
  .hero{position:relative;height:69px;background:#12100f;color:#fff;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:24px}
  .portal-brand{display:flex;align-items:center;gap:9px;color:#f3f3f4;font-size:13px;font-weight:750;letter-spacing:.04em}
  .portal-mark{width:30px;height:30px;border-radius:8px;background:#151517;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff}
  .portal-identity{text-align:right;line-height:1.15}
  .portal-identity strong{display:block;font-size:13px;letter-spacing:0}
  .portal-identity span{display:block;margin-top:3px;color:#a9a8a8;font-size:11px;font-weight:500}

  .content{padding:34px 40px 60px;max-width:1160px}

  .intro-title-row{display:flex;align-items:center;gap:7px}
  .intro-title-row h1{font-size:23px;font-weight:800;margin:0;letter-spacing:-.01em}

  .info-badge{width:17px;height:17px;border-radius:999px;display:inline-grid;place-items:center;color:#9a9ca2;position:relative;flex:none;border:0;background:none;padding:0;cursor:pointer}
  .info-badge svg{width:16px;height:16px;stroke-width:2}
  .info-badge .tip{position:absolute;top:calc(100% + 8px);left:50%;right:auto;transform:translate(-50%,-2px);width:max-content;max-width:min(240px,calc(100vw - 40px));background:#20212b;color:#f2f2f4;font-size:11.5px;font-weight:500;line-height:1.45;border-radius:8px;padding:10px 12px;opacity:0;visibility:hidden;transition:opacity .14s,transform .14s,visibility .14s;pointer-events:none;z-index:9999;box-shadow:0 8px 22px rgba(0,0,0,.18);text-align:left;white-space:normal;overflow-wrap:break-word}
  .info-badge:hover,.info-badge:focus-visible{color:#5a5c63}
  .info-badge:hover .tip,.info-badge:focus-visible .tip{opacity:1;visibility:visible;transform:translate(-50%,0)}

  .intro-sub{color:var(--muted);font-size:13px;margin:7px 0 0}

  .search-shell{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:7px;display:flex;align-items:center;gap:8px;box-shadow:0 5px 18px rgba(28,27,22,.04);margin:24px 0 0}
  .search-shell .search-icon{width:32px;height:32px;display:grid;place-items:center;color:#8b8d94;flex:none}
  .search-shell .search-icon svg{width:17px;height:17px}
  .search-shell input{border:0;outline:0;flex:1;font-size:13px;background:transparent;color:var(--ink)}
  .search-shell input::placeholder{color:#9a9ca1}
  .shortcut{background:var(--surface-2);border-radius:6px;padding:5px 8px;font-size:11px;font-weight:650;color:#7c7e85;margin-right:2px}
  .clear-btn{border:0;background:var(--surface-2);border-radius:6px;padding:5px 9px;font-size:11px;font-weight:650;color:#6c6e75;display:none}
  .clear-btn.show{display:inline-flex}

  .recent{display:flex;align-items:center;gap:7px;margin:15px 2px 30px;min-height:34px;flex-wrap:wrap;overflow:visible;position:relative;z-index:5}
  .recent-label{color:var(--muted);font-size:13px;margin-right:4px}
  .recent button.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;color:#45474d;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(20,24,32,.03)}
  .recent button.chip:hover{border-color:#c4c7cd;background:#fafbfc}
  .recent button.chip.active{border-color:#a88bea;background:var(--violet-soft);color:var(--violet-dark)}

  .card-route-key{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;white-space:nowrap}
  .card-route-key-title{font-weight:750;color:#777a81}
  .card-route-key-item{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:500}
  .card-route-key-icon{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;flex:none}
  .card-route-key-icon svg{width:12px;height:12px}
  .card-route-key-icon.managed{background:var(--violet-soft);color:var(--violet-dark)}
  .card-route-key-icon.secure{background:var(--teal-soft);color:var(--teal)}
  .card-route-key-icon.external{background:var(--slate-soft);color:var(--slate)}

  .directory-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
  .directory-head h2{font-size:16px;margin:0}
  .directory-head .count{color:var(--muted);font-size:12px;display:block;margin-top:3px}
  .filters{display:flex;align-items:center;gap:10px}
  .route-toggle{display:flex;gap:2px;background:var(--surface-2);padding:4px;border-radius:10px}
  .route-toggle button{border:0;background:transparent;padding:7px 9px;border-radius:7px;font-size:11.5px;font-weight:650;color:#6c6e75}
  .route-toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,24,32,.08)}
  .scale-select{height:37px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:0 12px;font-size:11px;font-weight:650}

  .company-card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .company-card{min-height:84px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px;display:flex;align-items:center;gap:11px;text-align:left;width:100%;transition:border-color .12s,box-shadow .12s,transform .12s}
  .company-card:hover{border-color:#c9bdf0;box-shadow:0 5px 16px rgba(75,54,145,.07);transform:translateY(-1px)}
  .company-card.selected{border-color:#a88bea;box-shadow:0 0 0 2px #eee9ff}
  .company-card .company{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
  .company-mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
  .company-mark.has-logo{background:#fff;border:1px solid #e1e3e7}
  .company-mark.has-logo img{width:66%;height:66%;object-fit:contain}
  .company-card-copy{display:flex;flex-direction:column;min-width:0}
  .company-card-copy strong{font-size:13px;margin-bottom:4px}
  .company-card-copy small{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .company-branch-count{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 8px;border-radius:999px;background:#f1f2f4;color:#686c74;font-size:11px;font-weight:800;flex:none}
  .company-card-route{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;flex:none}
  .company-card-route svg{width:14px;height:14px}
  .company-card-route.managed{background:var(--violet-soft);color:var(--violet-dark)}
  .company-card-route.secure{background:var(--teal-soft);color:var(--teal)}
  .company-card-route.external{background:var(--slate-soft);color:var(--slate)}
  .card-right{display:flex;align-items:center;gap:6px;flex:none}

  /* empty / no-results state */
  .empty-state{grid-column:1/-1;text-align:center;padding:70px 20px 40px}
  .empty-icon{width:64px;height:64px;border-radius:16px;background:var(--violet-soft);color:var(--violet-dark);display:grid;place-items:center;margin:0 auto 20px}
  .empty-icon svg{width:28px;height:28px;stroke-width:1.8}
  .empty-state h3{font-size:16px;margin:0 0 8px}
  .empty-state p{color:var(--muted);font-size:13px;line-height:1.55;margin:0 auto;max-width:420px}
  .empty-cta{margin-top:20px;border:0;background:var(--violet);color:#fff;border-radius:9px;padding:11px 20px;font-size:13px;font-weight:750;display:inline-flex;align-items:center;gap:7px}
  .empty-cta:hover{background:var(--violet-dark)}
  .empty-cta svg{width:15px;height:15px}
  .empty-caption{margin-top:10px;color:#9a9ca2;font-size:11.5px}

  /* drawer + scrim */
  .scrim{position:fixed;inset:0;background:rgba(19,20,23,.18);z-index:40;opacity:0;pointer-events:none;transition:opacity .16s}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:#fff;z-index:50;box-shadow:-14px 0 38px rgba(28,27,22,.12);transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .drawer-head{height:66px;padding:0 24px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
  .drawer-head h2{font-size:14px;margin:0}
  .drawer-close{margin-left:auto;width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:#989aa0;display:grid;place-items:center}
  .drawer-close:hover{background:var(--surface-2);color:var(--ink)}
  .drawer-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 24px 28px}
  .drawer-company{display:flex;align-items:center;gap:12px;padding:26px 0 22px;border-bottom:1px solid var(--line)}
  .drawer-company .company-mark{width:46px;height:46px;border-radius:10px}
  .drawer-company h3{font-size:19px;line-height:1.1;margin:0 0 8px}
  .route-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}
  .route-pill svg{width:12px;height:12px}
  .route-pill.managed{background:var(--violet-soft);color:var(--violet-dark)}
  .route-pill.secure{background:var(--teal-soft);color:var(--teal)}
  .route-pill.external{background:var(--slate-soft);color:var(--slate)}
  .drawer-section{padding:23px 0;border-bottom:1px solid var(--line)}
  .drawer-eyebrow{color:var(--violet);font-size:11px;font-weight:850;letter-spacing:.075em;text-transform:uppercase}
  .drawer-section h3{font-size:14px;margin:8px 0 7px}
  .drawer-section>p{color:var(--muted);font-size:13px;line-height:1.55;margin:0}
  .drawer-notice{display:flex;align-items:flex-start;gap:9px;margin-top:15px;border:1px solid;border-radius:9px;padding:12px;font-size:12px;line-height:1.45}
  .drawer-notice svg{width:15px;height:15px;margin-top:1px;flex:none}
  .drawer-notice b{display:block;margin-bottom:2px;color:var(--ink)}
  .drawer-notice.secure{background:#fff9e9;border-color:#eddcae;color:#785a18}
  .drawer-notice.external{background:#f5f5f7;border-color:#e3e4e8;color:#60636a}
  .drawer-primary{width:100%;min-height:42px;border-radius:9px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:800}
  .drawer-primary svg{width:15px;height:15px}
  .drawer-primary.managed{border:1px solid var(--violet);background:var(--violet);color:#fff}
  .drawer-primary.secure{border:1px solid var(--violet);background:#fff;color:var(--violet)}
  .drawer-primary.external{border:1px solid var(--line-strong);background:#fff;color:#444850}
  .drawer-requirements h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#81838a;margin:0 0 10px}
  .drawer-requirement{display:flex;align-items:center;gap:8px;padding:5px 0;color:#666a72;font-size:12px}
  .drawer-requirement svg{width:14px;height:14px;color:#1fa35b}
  .drawer-bottom{padding:14px 24px 20px;background:#fff;border-top:1px solid var(--line)}
  .drawer-guidelines{width:100%;min-height:39px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#4f535a;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:750}
  .drawer-guidelines:hover{background:var(--surface-2)}
  .drawer-guidelines svg{width:14px;height:14px}

  /* add-provider drawer form */
  .provider-form-icon{width:48px;height:48px;border-radius:13px;background:var(--violet-soft);color:var(--violet-dark);display:grid;place-items:center;margin:26px 0 16px}
  .provider-form-icon svg{width:22px;height:22px;stroke-width:1.8}
  .provider-form-title{font-size:19px;margin:0 0 8px}
  .provider-form-sub{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 22px}
  .form-field{margin-bottom:18px}
  .form-field label{display:block;font-size:12px;font-weight:700;color:#3f414a;margin-bottom:7px}
  .form-field input{width:100%;height:40px;border:1px solid var(--line-strong);border-radius:9px;padding:0 12px;font-size:13px;color:var(--ink);background:#fff}
  .form-field input::placeholder{color:#a6a8ae}
  .form-field input:focus{outline:2px solid #cabdf2;outline-offset:1px}
  .form-caption{margin-top:6px;color:#9a9ca2;font-size:11.5px;line-height:1.4}
  .form-notice{display:flex;align-items:flex-start;gap:9px;margin:4px 0 18px;border:1px solid #eddcae;background:#fff9e9;color:#785a18;border-radius:9px;padding:12px;font-size:12px;line-height:1.45}
  .form-notice svg{width:15px;height:15px;margin-top:1px;flex:none;color:#b58311}
  .form-notice b{display:block;margin-bottom:2px;color:#5c4413}
  .confirm-row{display:flex;align-items:flex-start;gap:9px;margin-bottom:6px}
  .confirm-row input[type=checkbox]{appearance:none;width:16px;height:16px;border-radius:4px;border:1.4px solid #c7c9d1;background:#fff;flex:none;margin-top:1px;display:grid;place-items:center;cursor:pointer}
  .confirm-row input[type=checkbox]:checked{background:var(--violet);border-color:var(--violet)}
  .confirm-row input[type=checkbox]:checked::after{content:'';width:9px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
  .confirm-row label{font-size:12.5px;color:#585a62;line-height:1.5;cursor:pointer}
  .drawer-footer-split{padding:14px 24px 20px;background:#fff;border-top:1px solid var(--line);display:flex;gap:10px}
  .btn-secondary{flex:none;height:42px;padding:0 18px;border:1px solid var(--line-strong);background:#fff;color:#3f414a;border-radius:9px;font-size:13px;font-weight:750}
  .btn-secondary:hover{background:var(--surface-2)}
  .btn-continue{flex:1;height:42px;border:0;border-radius:9px;background:var(--violet);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px}
  .btn-continue svg{width:15px;height:15px}
  .btn-continue:disabled{background:#e3e5e8;color:#9a9ca2;cursor:not-allowed}
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Kodex navigation">
      <a href="#">👤&nbsp;&nbsp;Profile</a>
      <a href="#">🔔&nbsp;&nbsp;Notifications</a>
      <div class="sidebar-break"></div>
      <a class="active" href="#">📋&nbsp;&nbsp;New Request</a>
      <a href="#">📥&nbsp;&nbsp;Requests</a>
      <a href="#">📁&nbsp;&nbsp;Cases</a>
      <div class="sidebar-spacer"></div>
      <a href="#">❓&nbsp;&nbsp;Help / Info</a>
      <a href="#">↩&nbsp;&nbsp;Sign Out</a>
      <span class="collapse">«</span>
    </aside>

    <div class="shell-main">
      <header class="hero">
        <div class="portal-brand"><span class="portal-mark">⋈</span><span>KODEX</span></div>
        <div class="portal-identity"><strong>Government Request Portal</strong><span>powered by ⋈ KODEX</span></div>
      </header>

      <main class="content">
        <div class="intro-title-row">
          <h1>Create New Request</h1>
        </div>
        <p class="intro-sub" id="introSub">Browse 9 companies and find the correct submission route.</p>

        <label class="search-shell">
          <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
          <input id="search" placeholder="Search by company, product, or domain…" autocomplete="off">
          <button class="clear-btn" id="clearSearch">Clear</button>
          <span class="shortcut">⌘ K</span>
        </label>

        <div class="recent" id="recent"></div>

        <div class="directory-head">
          <div>
            <h2>Browse companies</h2>
            <span class="count" id="resultCount">9 companies</span>
          </div>
          <div class="filters">
            <div class="route-toggle" id="routeToggle"></div>
            <select class="scale-select"><option>All categories</option></select>
            <select class="scale-select" id="sortSelect">
              <option value="az">A–Z</option>
              <option value="route">Group by route</option>
            </select>
          </div>
        </div>

        <div class="company-card-grid" id="grid"></div>
      </main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer"></aside>

<script>
const ROUTE_ICON = {
  managed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.78 4.78 4 4 0 0 1-6.74 0 4 4 0 0 1-4.78-4.78 4 4 0 0 1 0-6.75Z"/><path d="m9 12 2 2 4-4"/></svg>',
  secure: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.5V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9.5"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/><path d="M16 19h6"/><path d="M19 16v6"/></svg>',
  external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>'
};
const ICON = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  triangleAlert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
  arrowRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  externalLink: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
  building: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>'
};
const LOGOS = {

  Discord: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#5865F2" d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>',
  Pinterest: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#E60023" d="M12.017 0C5.396 0 .029 5.367.029 11.987c0 5.079 3.158 9.417 7.618 11.162-.105-.949-.199-2.403.041-3.439.219-.937 1.406-5.957 1.406-5.957s-.359-.72-.359-1.781c0-1.663.967-2.911 2.168-2.911 1.024 0 1.518.769 1.518 1.688 0 1.029-.653 2.567-.992 3.992-.285 1.193.6 2.165 1.775 2.165 2.128 0 3.768-2.245 3.768-5.487 0-2.861-2.063-4.869-5.008-4.869-3.41 0-5.409 2.562-5.409 5.199 0 1.033.394 2.143.889 2.741.099.12.112.225.085.345-.09.375-.293 1.199-.334 1.363-.053.225-.172.271-.401.165-1.495-.69-2.433-2.878-2.433-4.646 0-3.776 2.748-7.252 7.92-7.252 4.158 0 7.392 2.967 7.392 6.923 0 4.135-2.607 7.462-6.233 7.462-1.214 0-2.354-.629-2.758-1.379l-.749 2.848c-.269 1.045-1.004 2.352-1.498 3.146 1.123.345 2.306.535 3.55.535 6.607 0 11.985-5.365 11.985-11.987C23.97 5.39 18.592.026 11.985.026L12.017 0z"/></svg>',
  Roblox: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#111111" d="M18.926 23.998 0 18.892 5.075.002 24 5.108ZM15.348 10.09l-5.282-1.453-1.414 5.273 5.282 1.453z"/></svg>',
  Stripe: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#635BFF" d="M13.976 9.15c-2.172-.806-3.356-1.426-3.356-2.409 0-.831.683-1.305 1.901-1.305 2.227 0 4.515.858 6.09 1.631l.89-5.494C18.252.975 15.697 0 12.165 0 9.667 0 7.589.654 6.104 1.872 4.56 3.147 3.757 4.992 3.757 7.218c0 4.039 2.467 5.76 6.476 7.219 2.585.92 3.445 1.574 3.445 2.583 0 .98-.84 1.545-2.354 1.545-1.875 0-4.965-.921-6.99-2.109l-.9 5.555C5.175 22.99 8.385 24 11.714 24c2.641 0 4.843-.624 6.328-1.813 1.664-1.305 2.525-3.236 2.525-5.732 0-4.128-2.524-5.851-6.594-7.305h.003z"/></svg>'
};
const COMPANIES = [
  {name:'Airbnb',domain:'airbnb.com',route:'managed',logo:'Airbnb'},
  {name:'Binance',domain:'binance.com',route:'managed',logo:'Binance'},
  {name:'Coinbase',domain:'coinbase.com',route:'managed',logo:'Coinbase',badge:4},
  {name:'DigitalOcean',domain:'digitalocean.com',route:'secure',color:'#0080FF',mark:'D',
    requirements:['Legal request recipient email','Original legal process','Request reference and deadline']},
  {name:'Discord',domain:'discord.com',route:'managed',logo:'Discord'},
  {name:'Pinterest',domain:'pinterest.com',route:'managed',logo:'Pinterest'},
  {name:'Roblox',domain:'roblox.com',route:'managed',logo:'Roblox'},
  {name:'Stripe',domain:'stripe.com',route:'managed',logo:'Stripe',badge:4},
  {name:'Vimeo',domain:'vimeo.com',route:'external',color:'#1AB7EA',mark:'V'}
];
const ROUTE_CONFIG = {
  managed:{label:'Our provider', title:'Managed in Kodex', copy:'Submit and track this request entirely in Kodex. The provider has a contracted portal and a response SLA.', action:'Create request', requirements:['Case or reference number','Requesting agency contact','Legal process document']},
  secure:{label:'Kodex Link', title:'Out-of-network provider', copy:'Kodex Link prepares a secure request. You will send the invitation from your verified agency inbox.', action:'Create Kodex Link request', requirements:['Legal request recipient email','Original legal process','Request reference and deadline']},
  external:{label:'Directory only', title:'External submission', copy:'This company uses its own legal request process. Kodex provides guidance but does not carry the request.', action:'View instructions', requirements:['Original legal process','Provider-specific submission form','Confirmation of jurisdiction']}
};

const state = { query:'', filter:'all', sort:'az', selected:null, drawerOpen:false };

function mark(c){
  if (c.logo) return `<span class="company-mark has-logo">${LOGOS[c.logo]}</span>`;
  return `<span class="company-mark" style="color:${c.color};background:${c.color}0d;border:1px solid ${c.color}">${c.mark}</span>`;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function filtered(){
  let rows = COMPANIES.filter(c => {
    if (state.filter!=='all' && c.route!==state.filter) return false;
    if (state.query && !(c.name.toLowerCase().includes(state.query) || c.domain.toLowerCase().includes(state.query))) return false;
    return true;
  });
  if (state.sort==='az') rows = rows.slice().sort((a,b)=>a.name.localeCompare(b.name));
  if (state.sort==='route'){ const order={managed:0,secure:1,external:2}; rows = rows.slice().sort((a,b)=>order[a.route]-order[b.route] || a.name.localeCompare(b.name)); }
  return rows;
}

function renderRecent(){
  const names = ['Binance','Discord','Coinbase'];
  document.getElementById('recent').innerHTML = `
    <span class="recent-label">Recently used</span>
    ${names.map(n=>`<button class="chip ${state.query.toLowerCase()===n.toLowerCase()?'active':''}" data-recent="${n}">${n}</button>`).join('')}
    <span class="card-route-key">
      <span class="card-route-key-title">Submit via</span>
      <span class="info-badge" role="button" tabindex="0" aria-label="About routing information">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span class="tip">Routing information is maintained by Kodex and reflects each company’s current submission process.</span>
      </span>
      <span class="card-route-key-item"><span class="card-route-key-icon managed">${ROUTE_ICON.managed}</span>Our providers</span>
      <span class="card-route-key-item"><span class="card-route-key-icon secure">${ROUTE_ICON.secure}</span>Kodex Link</span>
      <span class="card-route-key-item"><span class="card-route-key-icon external">${ROUTE_ICON.external}</span>Directory only</span>
    </span>`;
  document.querySelectorAll('[data-recent]').forEach(b=>{
    b.addEventListener('click', ()=>{ document.getElementById('search').value = b.dataset.recent; state.query = b.dataset.recent.toLowerCase(); document.getElementById('clearSearch').classList.add('show'); render(); });
  });
}

function renderRouteToggle(){
  const opts = [['all','All routes'],['managed','Our providers'],['secure','Kodex Link'],['external','Directory only']];
  document.getElementById('routeToggle').innerHTML = opts.map(([k,l])=>`<button class="${state.filter===k?'on':''}" data-route="${k}">${l}</button>`).join('');
  document.querySelectorAll('[data-route]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.filter = b.dataset.route; render(); });
  });
}

function renderGrid(){
  const rows = filtered();
  document.getElementById('resultCount').textContent = `${rows.length} ${rows.length===1?'company':'companies'}`;
  if (!rows.length){
    const q = escapeHtml(state.query.trim() ? document.getElementById('search').value.trim() : '');
    document.getElementById('grid').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${ICON.building}</div>
        <h3>No providers found for “${q}”</h3>
        <p>You can still create a secure Link request by adding the provider’s name and legal request recipient email.</p>
        <button class="empty-cta" id="emptyCta">Create Link request ${ICON.arrowRight}</button>
        <div class="empty-caption">You’ll need a provider-owned recipient inbox.</div>
      </div>`;
    document.getElementById('emptyCta').addEventListener('click', openAddProviderDrawer);
    return;
  }
  document.getElementById('grid').innerHTML = rows.map(c=>{
    const badge = c.badge ? `<span class="company-branch-count">${c.badge}</span>` : '';
    return `<button class="company-card ${state.selected===c.name?'selected':''}" data-company="${c.name}">
        <span class="company">${mark(c)}<span class="company-card-copy"><strong>${c.name}</strong><small>${c.domain}</small></span></span>
        <span class="card-right">${badge}<span class="company-card-route ${c.route}">${ROUTE_ICON[c.route]}</span></span>
      </button>`;
  }).join('');
  document.querySelectorAll('[data-company]').forEach(b=>{
    b.addEventListener('click', ()=>{ openDrawer(b.dataset.company); });
  });
}

function openDrawer(name){
  const c = COMPANIES.find(x=>x.name===name);
  state.selected = name;
  state.drawerOpen = true;
  const cfg = ROUTE_CONFIG[c.route];
  const requirements = c.requirements || cfg.requirements;
  const notice = c.route==='secure'
    ? `<div class="drawer-notice secure">${ICON.triangleAlert}<div><b>Best-effort delivery</b>Kodex cannot confirm the message was sent until the provider authenticates. Not suitable for emergency requests.</div></div>`
    : c.route==='external'
      ? `<div class="drawer-notice external">${ICON.info}<div><b>No request can be started here</b>${c.name} operates its own law-enforcement portal, so Kodex will not create a Kodex Link request for them.</div></div>`
      : '';
  document.getElementById('drawer').innerHTML = `
    <div class="drawer-head"><h2>Company details</h2><button class="drawer-close" id="drawerClose">${ICON.x}</button></div>
    <div class="drawer-scroll">
      <div class="drawer-company">${mark(c)}<div><h3>${c.name}</h3><span class="route-pill ${c.route}">${ROUTE_ICON[c.route]}${cfg.label}</span></div></div>
      <section class="drawer-section"><div class="drawer-eyebrow">How this request works</div><h3>${cfg.title}</h3><p>${cfg.copy}</p>${notice}
        <button class="drawer-primary ${c.route}">${cfg.action} ${ICON.arrowRight}</button></section>
      <section class="drawer-section drawer-requirements"><h4>Before you begin</h4>${requirements.map(r=>`<div class="drawer-requirement">${ICON.check}${r}</div>`).join('')}</section>
    </div>
    <div class="drawer-bottom"><button class="drawer-guidelines">View law enforcement guidelines ${ICON.externalLink}</button></div>`;
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  openDrawerShell();
}

function openAddProviderDrawer(){
  state.drawerOpen = true;
  const prefillName = document.getElementById('search').value.trim();
  document.getElementById('drawer').innerHTML = `
    <div class="drawer-head"><h2>Create Link request</h2><button class="drawer-close" id="drawerClose">${ICON.x}</button></div>
    <div class="drawer-scroll">
      <div class="provider-form-icon">${ICON.building}</div>
      <h3 class="provider-form-title">Add a new provider</h3>
      <p class="provider-form-sub">This provider will be used for this request only. It won’t be added to the shared company directory.</p>
      <div class="form-field">
        <label for="providerName">Provider name</label>
        <input id="providerName" type="text" value="${escapeHtml(prefillName)}" placeholder="Provider or company name">
        <div class="form-caption">Use the legal or business name shown on the request.</div>
      </div>
      <div class="form-field">
        <label for="providerEmail">Legal request recipient email</label>
        <input id="providerEmail" type="email" placeholder="legal@provider.com">
        <div class="form-caption">Only this inbox will be able to authenticate and access the secure request.</div>
      </div>
      <div class="form-notice">${ICON.triangleAlert}<div><b>Provider not verified by Kodex</b>Confirm the provider name and recipient inbox before continuing. Kodex cannot verify delivery until the recipient authenticates.</div></div>
      <div class="confirm-row">
        <input type="checkbox" id="providerConfirm">
        <label for="providerConfirm">I confirm this inbox is controlled by the intended provider and is authorized to receive legal requests.</label>
      </div>
    </div>
    <div class="drawer-footer-split">
      <button class="btn-secondary" id="providerCancel">Cancel</button>
      <button class="btn-continue" id="providerContinue" disabled>Continue to Link request ${ICON.arrowRight}</button>
    </div>`;
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('providerCancel').addEventListener('click', closeDrawer);
  document.getElementById('providerConfirm').addEventListener('change', (e)=>{
    document.getElementById('providerContinue').disabled = !e.target.checked;
  });
  openDrawerShell();
}

function openDrawerShell(){
  document.getElementById('scrim').classList.add('show');
  document.getElementById('drawer').classList.add('show');
  document.body.classList.add('drawer-open');
  renderGrid();
}
function closeDrawer(){
  state.drawerOpen = false;
  document.getElementById('scrim').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  document.body.classList.remove('drawer-open');
}
document.getElementById('scrim').addEventListener('click', closeDrawer);

function render(){
  document.getElementById('introSub').textContent = `Browse ${COMPANIES.length} companies and find the correct submission route.`;
  renderRecent();
  renderRouteToggle();
  renderGrid();
}

document.getElementById('search').addEventListener('input', (e)=>{
  state.query = e.target.value.toLowerCase();
  document.getElementById('clearSearch').classList.toggle('show', !!state.query);
  render();
});
document.getElementById('clearSearch').addEventListener('click', ()=>{
  document.getElementById('search').value = '';
  state.query = '';
  document.getElementById('clearSearch').classList.remove('show');
  render();
});
document.getElementById('sortSelect').addEventListener('change', (e)=>{
  state.sort = e.target.value;
  render();
});
document.addEventListener('keydown', (e)=>{ if (e.key==='Escape') closeDrawer(); });

render();
</script>
</body>
</html>
