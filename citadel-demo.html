  if (t.hasAttribute('data-rf-info-tab')){ stop(); RF().infoTab = t.dataset.rfInfoTab; renderPane(); return; }
  if (t.hasAttribute('data-rf-info-toggle')){ stop(); RF().infoOpen = !RF().infoOpen; renderPane(); return; }
  if (t.hasAttribute('data-rf-notes-view')){ stop(); openInformation('notes'); return; }
  if (t.id === 'rfIdScen'){ stop(); S.idRequired = S.idRequired === false; render(); toast(S.idRequired ? 'Prototype: ID document required' : 'Prototype: ID document not required'); return; }
  if (t.id === 'nextBtn' && S.accepted && ['presence','agentCheck'].includes(curStep().key)){
    stop(); if (t.disabled) return;
    if (curStep().key === 'presence'){ ['dup','presence'].forEach(k => (Q[k]||[]).forEach(q => S.answers[q.id] = 'yes')); log('Agency verified at Agency Check','g'); go(1); toast('Agency verified'); }
    else { log('Agent Check complete','g'); go(1); toast('Agent Check complete'); }
    return;
  }
  if (t.dataset.rfReject){ stop(); const j = RF().reject; j.open = true; j.kind = t.dataset.rfReject; j.reason = ''; j.note = ''; renderPane(); const s = document.getElementById('rfRejReason'); if (s) s.focus(); return; }
  if (t.hasAttribute('data-rf-reject-close')){ stop(); RF().reject.open = false; renderPane(); return; }
  if (t.hasAttribute('data-rf-reject-confirm')){
    stop(); const j = RF().reject; if (!j.reason) return;
    S.decision.choice = 'deny'; S.decision.note = [j.reason, j.note.trim()].filter(Boolean).join(' — '); S.resolvedAt = now();
    log('Decision: Denied','r'); log(j.kind === 'agency' ? 'Agency rejected at Agency Check' : 'Agent denied at Agent Check','r');
    S.step = steps().length - 1; S.status = 'resolved'; j.open = false; RF().open = null;
    render(); toast(j.kind === 'agency' ? 'Agency rejected' : 'Agent denied'); return;
  }
  if (!S.accepted || !curStep() || !['presence','agentCheck'].includes(curStep().key)) return;
  const r = () => RF();
  if (t.dataset.rfOpen){ stop(); rfOpen(t.dataset.rfOpen); return; }
  if (t.hasAttribute('data-rf-close')){ stop(); rfClose(); return; }
  if (t.dataset.rfEdit){ stop(); const k = t.dataset.rfEdit; r().editing = true; r().draft = JSON.parse(JSON.stringify(rfVals(k)));
    if (k === 'website' && r().draft.found === 'no') r().draft.found = 'yes';
    if (k === 'safety' && rfCta(k).cls === 'review') r().draft.safety = 'ok';
    rfRenderDrawer(); const f = rfLayer().querySelector('.rf-form input, .rf-form select, .rf-form button'); if (f) f.focus(); return; }
  if (t.hasAttribute('data-rf-cancel')){ stop(); r().editing = false; r().draft = JSON.parse(JSON.stringify(rfVals(r().open))); rfRenderDrawer(); return; }
  if (t.dataset.rfSave){
    stop(); const k = t.dataset.rfSave; if (!rfSave(k)) return;
    renderHead(); toast(`${rfDef(k).name}: saved`);
    if (rfKindOf(k) === 'agency' && rfSignal()){ r().open = null; renderPane(); return; }
    rfAfter(k); return;
  }
  if (t.dataset.rfBatch){
    stop(); const keys = t.dataset.rfBatch.split(','); r().batch = {keys}; rfOpen(keys[0]); return;
  }
  if (t.dataset.rfAccept){
    stop(); const k = t.dataset.rfAccept, o = rfOtto(k);
    r().you[k] = {how:'confirmed', vals:JSON.parse(JSON.stringify(o.vals)), line:'Confirmed by you · Otto’s answer'};
    log(`${rfDef(k).name}: ${rfAnswer(k)} (confirmed by you)`, 'g'); renderHead();
    if (r().open === k) rfAfter(k); else renderPane();
    return;
  }
  if (t.dataset.rfConfirm){
    stop(); const k = t.dataset.rfConfirm, o = rfOtto(k);
    r().you[k] = {how:'reviewed', vals:JSON.parse(JSON.stringify(o.vals)), line:'Reviewed by you · agreed with Otto'};
    log(`${rfDef(k).name}: ${rfAnswer(k)} (confirmed by you)`, 'r');
    r().open = null; renderHead(); renderPane(); toast('Saved. Otto recommends rejecting this agency.'); return;
  }
  if (t.dataset.rfUndo){ stop(); const k = t.dataset.rfUndo; delete r().you[k]; delete r().reason[k]; log(`${rfDef(k).name}: answer undone`, 'a'); rfOpen(k); renderHead(); return; }
  if (t.dataset.rfSet){ stop(); const s = t.dataset.rfSet, i = s.indexOf(':'); r().draft[s.slice(0,i)] = s.slice(i+1); rfRenderDrawer(); return; }
  if (t.hasAttribute('data-rf-rerun')){
    stop(); if (r().rerunning) return; r().rerunning = true; renderPane(); toast('Otto is re-running');
    setTimeout(() => { if (S.rf){ S.rf.rerunning = false; renderPane(); toast('Otto finished. No changes.'); } }, 1600); return;
  }
  if (t.dataset.rfRecheck){
    stop(); const k = t.dataset.rfRecheck; if (r().recheck) return; r().recheck = k; rfRenderDrawer();
    setTimeout(() => { if (S.rf){ S.rf.recheck = null; rfRenderDrawer(); toast(`Otto re-ran “${rfDef(k).name}”. No changes.`); } }, 1300); return;
  }
}, true);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.rfRejectNote !== undefined && S.rf){ S.rf.reject.note = t.value; return; }
  const f = t.dataset && t.dataset.rfInput; if (!f || !S.rf || !S.rf.draft) return;
  S.rf.draft[f] = t.value;
  const b = document.querySelector('[data-rf-save]'); if (b) b.disabled = !rfCanSave(b.dataset.rfSave);
}, true);
document.addEventListener('change', e => {
  if (!S.rf) return;
  const t = e.target;
  if (t.dataset && t.dataset.rfRejectReason !== undefined){ e.stopImmediatePropagation(); S.rf.reject.reason = t.value; renderPane(); const s = document.getElementById('rfRejReason'); if (s) s.focus(); return; }
  if (t.dataset && t.dataset.rfInput){ e.stopImmediatePropagation(); return; }   // typing is handled on input; no re-render on blur
  if (t.dataset && t.dataset.rfSelect){ e.stopImmediatePropagation(); S.rf.draft[t.dataset.rfSelect] = t.value; rfRenderDrawer(); return; }
  if (t.dataset && t.dataset.rfReason){ e.stopImmediatePropagation(); S.rf.reason[t.dataset.rfReason] = t.value; return; }
  if (t.name === 'rfDup' || (t.name||'').startsWith('rfIp-')){
    e.stopImmediatePropagation();
    if (t.name === 'rfDup') S.rf.draft.dup = t.value; else S.rf.draft[t.name.slice(5)] = t.value;
    rfRenderDrawer(); const n = rfLayer().querySelector(`input[name="${t.name}"][value="${t.value}"]`); if (n) n.focus(); return;
  }
}, true);
document.addEventListener('keydown', e => {
  if (!S.rf) return;
  if (e.key === 'Escape'){
    if (S.rf.reject.open){ e.preventDefault(); S.rf.reject.open = false; renderPane(); return; }
    if (S.rf.open){ e.preventDefault(); rfClose(); return; }
  }
  if (e.key === 'Tab'){
    const box = S.rf.reject.open ? document.querySelector('.op-reject-modal') : S.rf.open ? rfLayer().querySelector('.rf-drawer') : null;
    if (!box) return;
    const f = [...box.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')].filter(x => x.getClientRects().length);
    if (!f.length) return;
    if (e.shiftKey && (document.activeElement === f[0] || document.activeElement === box)){ e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)){ e.preventDefault(); f[0].focus(); }
  }
}, true);

// Open on the simplified Agency Check while retaining the full Citadel shell.
S.accepted=true;S.status='progress';S.step=steps().findIndex(x=>x.key==='presence');S.mapTo='sheriff';S.focus='ip';ensurePresence();


document.addEventListener('click',e=>{
 const t=e.target.closest('[data-ip-record]');if(!t)return;
 e.preventDefault();e.stopImmediatePropagation();
 S.modal={kind:'evidence',key:'ip',tab:t.dataset.ipRecord};renderModal(true);
},true);


/* static chrome icons */
document.getElementById('menuToggle').innerHTML = I('menu');
document.getElementById('homeIcon').innerHTML = I('home').replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px"');
document.getElementById('refreshBtn').innerHTML = I('refresh');
document.getElementById('resetBtn').innerHTML = I('reset') + 'Reset flow';
renderSide();
/* Auto-collapse the right column on smaller screens; the toggle in the Workflow tabs still opens it. */
/* Smaller screens: the left navigation collapses to icons first (below 1440px),
   then the right column hides (below 1200px). Both can still be toggled by hand. */
const SIDE_NARROW = matchMedia('(max-width:1439px)');
const NARROW = matchMedia('(max-width:1199px)');
function applySide(){ document.getElementById('app').classList.toggle('side-collapsed', !!S.sideCollapsed); renderSide(); }
S.sideCollapsed = true; // collapsed icon rail is the default; ≡ expands it
S.panel = !NARROW.matches;
SIDE_NARROW.addEventListener('change', () => { if (SIDE_NARROW.matches) S.sideCollapsed = true; applySide(); });
NARROW.addEventListener('change', () => { S.panel = !NARROW.matches; render(); });
applySide();
render();
</script>
